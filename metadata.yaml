name: astrbot_plugin_sl_status
display_name: 运行状态卡
short_desc: 一条指令生成整幅插画背景的系统状态卡：CPU/RAM/DISK 进度条、token 消耗、上下文、协议端版本，支持随机换图与字段开关
desc: 发送 状态（别名 sl / st / 运行状态）生成整幅插画背景的系统状态卡：CPU / RAM / DISK 三条百分比进度条，另含 CPU 型号与线程数、今日 token 消耗、当前会话上下文、对话模型、插件数、协议端版本与运行时长。字段可在面板逐项开关，背景可在 assets/bg/ 放多张随机切换；纯本地 Pillow 渲染，失败自动回退纯文本，协议端自动适配 SnowLuma / NapCat 等 OneBot v11 实现。
help: |
  ## 功能
  发送 `状态`（别名 `sl` / `st` / `运行状态`）生成一张状态卡图片：整幅插画背景 + 磨砂信息面板，
  含 CPU / RAM / DISK 三条百分比进度条，以及 CPU 型号与线程数、今日 token 消耗、当前会话上下文、
  对话模型、插件数、协议端版本、运行时长。所有字段可在面板分别开关。

  ## 兼容性
  - AstrBot >= 4.0.0，Python 3.10+（AstrBot 镜像已内置 Pillow / psutil）
  - 平台：`aiocqhttp`（OneBot v11）。协议端自动探测 SnowLuma / NapCat / 其它 OneBot v11 实现
  - 渲染为纯本地 Pillow，不依赖 t2i、playwright 或外部渲染服务；渲染失败自动回退纯文本

  ## 安装
  把插件目录放进 `<AstrBot 数据目录>/plugins/astrbot_plugin_sl_status/`，重启 AstrBot 即可。
  也可以用 `git clone` 直接克隆到插件目录。

  ## 必要配置
  无。装上就能用：默认随机背景、全字段显示、协议端自动探测。

  ## 主要配置
  `title`（标题）、`bg_mode`（random 每次随机 / fixed 固定）、`bg_fixed`（固定用哪张）、
  `send_image`（关掉只发文字）、`show_cpu` / `show_ram` / `show_disk` / `show_tokens` / `show_context` /
  `show_cpu_model` / `show_model` / `show_plugins` / `show_protocol` / `show_uptime`（各字段显隐）、
  `api_base` / `access_token`（协议端地址与令牌，留空自动探测）。

  ## 字体与字号
  正文三档字重全部可换：`font_body`（正文）、`font_medium`（数值，比正文粗一档）、`font_bold`（标签）；
  标题单独用 `font_title`（留空为系统 Noto Sans CJK，内置圆体缺部分简体字形，不建议用圆体做标题）。
  以上均填 `assets/fonts/` 下的文件名或绝对路径，留空用内置字体。
  `font_scale` 全局缩放（0.7~1.6，行距同步缩放），`title_scale` 只缩放标题。

  ## 管理命令
  `状态图`（别名 `slbg`，管理员）列出 `assets/bg/` 里的背景图与当前背景模式。

  ## 工作方式
  读取容器 cgroup 的 CPU/内存计数与 `psutil` 的磁盘用量；token 与上下文取自 AstrBot 自身数据库（只读）；
  协议端信息通过 OneBot `get_version_info` / `get_status` 获取。数据用 Pillow 逐层绘制：
  背景 cover 裁剪 → 面板区高斯模糊压深 → 进度条 → 文字（暗影 + 正文两层），输出 PNG 发送。

  ## 隐私
  卡片只显示数值与版本号，不显示 QQ 号、昵称、群号、好友列表、文件路径、主机名；所有指标本地读取，不向外发送。

  ## 许可证
  MIT。内置圆体 M PLUS Rounded 1c 为 SIL OFL 1.1（见 FONT-NOTICE.md）。
